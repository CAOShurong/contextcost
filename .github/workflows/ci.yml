name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range on the two platforms most likely to
        # disagree, plus the versions in between on Linux only. The Windows
        # entries are not decoration: this tool reads paths, encodings and
        # line endings, which is exactly where the two diverge.
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Only pytest. The package itself has no dependencies, and installing it
      # would hide an accidental one.
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
        env:
          PYTHONPATH: src

  end-to-end:
    name: Run against a real repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .

      # A unit test can only prove the pieces agree with each other. This
      # checks the assertion the README actually makes, against a repository
      # assembled on disk: that the saving is a real difference between two
      # walks and that nothing was removed which was not proposed.
      - name: Build a repository with the usual ballast
        run: |
          mkdir -p demo/src demo/vendor/legacy
          printf 'export const app = 1;\n%.0s' {1..400} > demo/src/app.js
          printf 'var helper = {};\n%.0s' {1..400} > demo/vendor/legacy/helpers.js
          python - <<'PY'
          entries = ",".join(
              f'"node_modules/pkg{n}":{{"version":"1.0.{n}"}}' for n in range(400)
          )
          open("demo/package-lock.json", "w").write(
              '{"lockfileVersion":3,"packages":{' + entries + "}}\n"
          )
          PY

      - name: The exit code reports that something was found
        run: |
          set +e
          contextcost demo --quiet
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: The reported saving survives being checked
        run: |
          # `|| true` is load-bearing. contextcost exits 1 when it finds
          # something, which is the point of the exit code -- and under
          # `bash -e`, which is what GitHub runs, that aborts the step. The
          # first version of this job failed here, which is a fair thing for
          # the tool's own CI to have discovered about the tool.
          contextcost demo --json > result.json || true
          python - <<'PY'
          import json, subprocess

          report = json.load(open("result.json"))["reduction"]
          before, after, saved = report["before"], report["after"], report["saved"]

          assert report["measured"] is True, report
          assert saved == before - after, (saved, before, after)
          assert saved > 0, "the fixture is full of lockfile; something must be found"
          assert "/package-lock.json" in report["patterns"], report["patterns"]

          # The claim the whole tool rests on: apply the patterns for real and
          # measure again, independently of the code path that produced them.
          with open("demo/.gitignore", "w") as handle:
              handle.write("\n".join(report["patterns"]) + "\n")
          # Not check=True: this run should exit 0 because the patterns it is
          # verifying have removed everything there was to find. Asserting
          # that explicitly makes a non-zero code a readable failure rather
          # than a CalledProcessError.
          run = subprocess.run(
              ["contextcost", "demo", "--json"], capture_output=True, text=True
          )
          assert run.returncode == 0, f"second run still found something: {run.stdout[:400]}"
          again = json.loads(run.stdout)
          measured_after = again["walk"]["tokens"]

          # Writing the .gitignore added a file the first measurement never
          # saw, so the second total is higher by exactly what that file
          # costs. Asserting the exact relationship rather than allowing a
          # tolerance: the first version of this job asserted plain equality
          # and failed by 11 tokens, and 11 tokens turned out to be precisely
          # the size of the .gitignore it had just written. A tolerance would
          # have hidden that instead of explaining it.
          from contextcost.estimate import estimate_tokens

          with open("demo/.gitignore", encoding="utf-8") as handle:
              overhead = estimate_tokens(handle.read()).tokens

          assert measured_after == after + overhead, (
              f"reported {after} after exclusion; independent run says "
              f"{measured_after}, and the new .gitignore accounts for only {overhead}"
          )
          print(f"verified: {before:,} -> {after:,} tokens, {saved:,} saved "
                f"(+{overhead} for the .gitignore that was written)")
          PY

  readme:
    name: README figures are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pillow
      # Fails if a number in the README no longer matches what the code
      # produces. A stale figure is the failure this project argues against.
      - run: python docs/build_docs.py --check

  calibration:
    name: The error bound still holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip tiktoken
      # Fails if the estimator has drifted past the bound it advertises.
      # ERROR_BOUND was an unmeasured guess once, and it was wrong by a factor
      # of four; this is what stops that from being possible a second time.
      - run: python docs/calibrate.py --check

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check src tests docs
      - run: ruff format --check src tests docs

  build:
    name: Package builds and is publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
