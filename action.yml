name: "contextcost"
description: >-
  Comment the context-cost delta of a pull request: how many tokens this PR
  adds to (or removes from) what an AI coding agent pays to read the
  repository, and how much of it is waste. Measured, not guessed.
author: "Shurong Cao"

branding:
  icon: "activity"
  color: "purple"

inputs:
  github-token:
    description: "Token used to post the PR comment."
    required: false
    default: ${{ github.token }}
  consumer:
    description: "Ignore-input model: generic, cursor, aider or repomix."
    required: false
    default: "generic"
  max-added:
    description: >-
      Optional token budget. The action fails if the PR adds more than this
      many tokens to what an agent reads (e.g. 1000000). Leave unset to never
      fail.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Check out the merge base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: contextcost-base
        fetch-depth: 0

    - name: Check out the PR head
      uses: actions/checkout@v7
      with:
        path: contextcost-head
        # fetch-depth: 1 is enough; the base step already fetched history.

    - name: Install contextcost
      run: pipx install contextcost
      shell: bash

    - id: delta
      name: Measure the delta
      env:
        CONSUMER: ${{ inputs.consumer }}
      run: |
        set -euo pipefail
        contextcost contextcost-head \
          --delta contextcost-base \
          --consumer "$CONSUMER" \
          --markdown --no-color | tee "$RUNNER_TEMP/delta.md"
        echo "path=$RUNNER_TEMP/delta.md" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Post or update the PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- contextcost-delta -->';
          const body = fs.readFileSync(process.env.DELTA_PATH, 'utf8');
          const marked = marker + '\n' + body;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: marked,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: marked,
            });
          }
      env:
        DELTA_PATH: ${{ steps.delta.outputs.path }}

    - name: Fail on a large addition
      if: env.CONTEXTCOST_MAX_ADDED != ''
      env:
        CONTEXTCOST_MAX_ADDED: ${{ inputs.max-added }}
      run: |
        set -euo pipefail
        max=$(contextcost contextcost-head --delta contextcost-base --json \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["delta"]["added"])')
        echo "added tokens: ${max} (budget ${CONTEXTCOST_MAX_ADDED})"
        [ "${max}" -le "${CONTEXTCOST_MAX_ADDED}" ]
      shell: bash
